services:

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-myuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blockfrost}
      POSTGRES_DB: ${POSTGRES_DB:-mydatabase}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myuser} -d ${POSTGRES_DB:-mydatabase}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://myuser:blockfrost@db:5432/mydatabase}
      BLOCKFROST_PROJECT_ID: ${BLOCKFROST_PROJECT_ID}
      PORT: ${PORT:-3000}
      HOST: ${HOST:-0.0.0.0}
      START_BLOCK: ${START_BLOCK:-10000000}
      END_BLOCK: ${END_BLOCK:-10000500}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"

volumes:
  db_data: